<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>告発ゲーム 問題表示</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:transparent;color:#f1eadc;font-family:"Yu Gothic UI","Meiryo",sans-serif}.stage{width:1920px;height:1080px;padding:56px 70px;background:linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px),radial-gradient(circle at 50% 0,rgba(216,182,90,.14),transparent 32%),linear-gradient(135deg,#050505,#111114 48%,#050505);background-size:48px 48px,48px 48px,auto,auto;transform-origin:top left;position:relative}.stage:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.034),rgba(255,255,255,.034) 1px,transparent 1px,transparent 5px);opacity:.35;pointer-events:none}.content{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:34px}.top{display:grid;grid-template-columns:1fr 420px;gap:36px;align-items:start}.code{color:#d8b65a;font-size:28px;font-weight:800;letter-spacing:.08em}h1{margin:10px 0 0;font-size:120px;line-height:1;font-weight:800}.sub{margin-top:18px;color:#9e9689;font-size:31px}.prize{padding:24px 28px;background:rgba(216,182,90,.1);border:1px solid rgba(216,182,90,.35)}.label{color:#9e9689;font-size:22px}.money{margin-top:4px;color:#d8b65a;font-size:78px;line-height:1;font-weight:800}.main{display:grid;grid-template-columns:1fr 460px;gap:32px}.questionBox{padding:38px 42px;background:rgba(10,10,12,.92);border:1px solid rgba(216,182,90,.26);border-left:8px solid #d8b65a;display:grid;align-content:center}.questionLabel{color:#9e9689;font-size:24px;margin-bottom:22px}.question{font-size:56px;line-height:1.34;font-weight:800}.side{display:grid;gap:18px}.choice{display:grid;grid-template-columns:86px 1fr 116px;align-items:center;gap:18px;min-height:120px;padding:22px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.12)}.choice.majority{border-color:rgba(216,182,90,.75);background:rgba(216,182,90,.1)}.choice.correct{border-color:rgba(74,183,122,.85)}.choice.wrong{border-color:rgba(185,31,44,.9)}.key{color:#d8b65a;font-size:58px;font-weight:900}.ctext{font-size:32px;line-height:1.25;font-weight:700}.badge{color:#9e9689;font-size:22px;text-align:right}.choice.correct .badge{color:#4ab77a}.choice.wrong .badge{color:#b91f2c}.bars{display:grid;gap:14px;padding:20px;background:rgba(10,10,12,.86);border:1px solid rgba(255,255,255,.1)}.bar{display:grid;grid-template-columns:42px 1fr 86px;align-items:center;gap:12px;color:#9e9689;font-size:22px}.track{height:16px;background:rgba(255,255,255,.08);overflow:hidden}.fill{height:100%;background:#d8b65a;width:0}.footer{display:flex;justify-content:space-between;gap:24px;color:#9e9689;font-size:26px}.alert{color:#d8b65a}
</style>
</head>
<body><main class="stage" id="stage"><div class="content"><section class="top"><div><div class="code">KOKUHATSU GAME / <span id="dayCode">DAY 7</span></div><h1>告発ゲーム</h1><div class="sub">コメントで A / B / C を選択せよ。</div></div><aside class="prize"><div class="label">CURRENT PRIZE</div><div class="money" id="money">100万円</div></aside></section><section class="main"><div class="questionBox"><div class="questionLabel">TODAY'S QUESTION</div><div class="question" id="question"></div></div><div class="side"><div id="choices"></div><div class="bars" id="bars"></div></div></section><section class="footer"><div>残り30秒は最終集計中。締切後、多数派が公式回答になる。</div><div class="alert" id="ticker"></div></section></div></main><script>
const stageEl=document.getElementById('stage');function scale(){const f=Math.min(innerWidth/1920,innerHeight/1080);stageEl.style.transform=`scale(${f})`;document.body.style.width=1920*f+'px';document.body.style.height=1080*f+'px'}function render(s){dayCode.textContent=s.day==='0'?'FINAL DAY':`DAY ${s.day}`;money.textContent=`${s.prize}万円`;question.textContent=s.question||'';ticker.textContent=s.ticker||'';choices.innerHTML='';['A','B','C'].forEach(k=>{const row=document.createElement('div');row.className='choice';if(s.majority===k)row.classList.add('majority');if(s.revealResult&&s.correct===k)row.classList.add('correct');if(s.revealResult&&s.majority===k&&s.correct&&s.correct!==k)row.classList.add('wrong');row.innerHTML=`<div class="key">${k}</div><div class="ctext">${s.choices?.[k]||k}</div><div class="badge">${s.majority===k?'多数派':s.revealResult&&s.correct===k?'正解':''}</div>`;choices.append(row)});bars.innerHTML='';(s.survey?.results||[]).forEach(r=>{const el=document.createElement('div');el.className='bar';const hide=s.survey.active&&s.survey.remainSec<=30;el.innerHTML=`<b>${r.key}</b><div class="track"><div class="fill" style="width:${hide?0:r.pct}%"></div></div><span>${hide?'集計中':r.count+'票'}</span>`;bars.append(el)})}async function poll(){try{const r=await fetch('/api/kokuhatsu/state');render(await r.json())}catch{}setTimeout(poll,1000)}addEventListener('resize',scale);scale();poll();
</script></body></html>
