<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>縦型コメントオーバーレイ</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    overflow: hidden;
    font-family: "Noto Sans JP", "Yu Gothic UI", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  /* ヘッダー2段レイアウト */
  #statsBar {
    flex-direction: column;
    gap: 0;
    padding: 4px 4px;
  }
  .bar-row {
    display: none;
    align-items: center;
    gap: 0;
  }
  .bar-row.on { display: flex; }
  .plat-label {
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 1px;
    padding: 4px 12px 4px 8px;
    white-space: nowrap;
    min-width: 66px;
  }
  .fw-label { color: #ff8c1a; text-shadow: 0 0 10px rgba(255,140,26,0.5); }
  .kick-label { color: #53fc18; text-shadow: 0 0 10px rgba(83,252,24,0.5); }
  /* 行間に区切り線 */
  #kickBar.on { border-top: 1px solid rgba(255,255,255,0.08); margin-top: 2px; padding-top: 2px; }
  #statsBar {
    position: fixed;
    top: 0;
    width: 390px;
    display: flex;
    align-items: stretch;
    gap: 0;
    z-index: 10;
    background: rgba(8,8,10,0.72);
    backdrop-filter: blur(14px) saturate(160%);
    border-radius: 0 0 10px 10px;
    padding: 7px 4px;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.08),
      0 0 0 1px rgba(255,255,255,0.05);
  }
  #statsBar.pos-right { right: 12px; }
  #statsBar.pos-left { left: 12px; }
  .stat {
    position: relative;
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 3px 8px;
    flex: 1;
  }
  .stat.divider::before {
    content: '';
    position: absolute;
    left: 0; top: 18%; bottom: 18%;
    width: 1px;
    background: rgba(255,255,255,0.12);
  }
  .stat .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ff8c1a;
    box-shadow: 0 0 10px #ff8c1a, 0 0 20px rgba(255,140,26,0.5);
    flex-shrink: 0;
    animation: pulse 2.4s ease-in-out infinite;
  }
  .stat.kick .dot {
    background: #53fc18;
    box-shadow: 0 0 10px #53fc18, 0 0 20px rgba(83,252,24,0.5);
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(0.82); }
  }
  .stat .txt { display: flex; flex-direction: column; line-height: 1; }
  .stat .label {
    font-size: 11px;
    color: #ff8c1a;
    letter-spacing: 1.4px;
    font-weight: 800;
    margin-bottom: 4px;
    white-space: nowrap;
    text-shadow: 0 0 12px rgba(255,140,26,0.45);
  }
  .stat.kick .label {
    color: #53fc18;
    text-shadow: 0 0 12px rgba(83,252,24,0.45);
  }
  .stat .num {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -0.6px;
    color: #fff;
    font-variant-numeric: tabular-nums;
    display: inline-block;
    line-height: 1;
  }
  /* プラットフォーム表示 */
  #pfBadge {
    display: none;
    align-items: center;
    padding: 3px 14px 3px 12px;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.5px;
    color: #ff8c1a;
    white-space: nowrap;
    text-shadow: 0 0 14px rgba(255,140,26,0.5);
  }
  #pfBadge.kick {
    color: #53fc18;
    text-shadow: 0 0 14px rgba(83,252,24,0.5);
  }
  /* 更新演出 */
  .stat.bump .num {
    animation: numPop 0.65s cubic-bezier(0.18, 1.5, 0.4, 1);
  }
  .stat.bump .dot {
    animation: dotBurst 0.65s ease-out;
  }
  @keyframes numPop {
    0%   { transform: translateY(0) scale(1); }
    28%  { transform: translateY(-4px) scale(1.16);
           text-shadow: 0 0 26px rgba(255,255,255,0.95), 0 0 8px rgba(255,255,255,0.7); }
    100% { transform: translateY(0) scale(1); }
  }
  @keyframes dotBurst {
    0%   { transform: scale(1); }
    30%  { transform: scale(2.1); }
    100% { transform: scale(1); }
  }
  .stat.show { animation: statIn 0.55s cubic-bezier(0.2, 1, 0.3, 1); }
  @keyframes statIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #list {
    position: fixed;
    bottom: 12px;
    width: 390px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 6px;
    pointer-events: none;
  }
  #list.pos-right { right: 12px; }
  #list.pos-left { left: 12px; }
  .c {
    background: rgba(0,0,0,var(--bg-op, 0.55));
    border-radius: 8px;
    padding: 7px 12px;
    animation: slideIn 0.25s ease-out;
    word-break: break-word;
  }
  .c.fade { transition: opacity 0.8s; opacity: 0; }
  .c .name {
    font-size: 18px;
    font-weight: 700;
    display: block;
    margin-bottom: 2px;
  }
  .c .text {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.35;
  }
  .c.item {
    border: 2px solid #ffd54f;
    box-shadow: 0 0 12px rgba(255,180,0,0.5);
  }
  .c.item .text { color: #ffd54f; }
  .c.item img {
    height: 44px;
    vertical-align: middle;
  }
  @keyframes slideIn {
    from { transform: translateY(14px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  /* ===== アンケート ===== */
  #surveyBox {
    position: fixed;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%);
    width: 620px;
    background: rgba(8,8,10,0.88);
    backdrop-filter: blur(14px) saturate(160%);
    border-radius: 14px;
    padding: 16px 22px 18px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
    display: none;
    z-index: 20;
    font-family: "Noto Sans JP", "Yu Gothic UI", sans-serif;
  }
  #svHead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  #svTitle {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #fff;
  }
  #svTimer {
    font-size: 42px;
    font-weight: 900;
    color: #ff8c1a;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 24px rgba(255,140,26,0.6);
  }
  #svTimer.ended {
    font-size: 17px;
    letter-spacing: 2px;
  }
  #svTimer.urgent {
    color: #ff3b3b;
    text-shadow: 0 0 28px rgba(255,59,59,0.85);
    animation: svUrgent 0.8s ease-in-out infinite;
  }
  @keyframes svUrgent {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.13); }
  }
  #svProg {
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  #svProgBar {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ff8c1a, #ffb347);
    box-shadow: 0 0 12px rgba(255,140,26,0.6);
    transition: width 0.25s linear;
  }
  .svRow { margin-bottom: 13px; }
  .svRow:last-child { margin-bottom: 0; }
  .svTop {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .svLabel { font-size: 21px; font-weight: 800; color: #fff; }
  .svKey {
    display: inline-block;
    min-width: 28px;
    text-align: center;
    color: #111;
    font-weight: 900;
    border-radius: 5px;
    padding: 2px 7px;
    margin-right: 11px;
    font-size: 17px;
  }
  .svVal { font-size: 15px; color: rgba(255,255,255,0.7); font-weight: 700; font-variant-numeric: tabular-nums; }
  .svVal b { color: #fff; font-size: 23px; margin-right: 2px; }
  .svBar { height: 15px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
  .svFill { height: 100%; width: 0%; border-radius: 999px; transition: width 0.7s cubic-bezier(0.3, 1, 0.4, 1); }
  .svRow.A .svKey { background: #ff8c1a; }
  .svRow.A .svFill { background: linear-gradient(90deg, #ff8c1a, #ffb347); box-shadow: 0 0 16px rgba(255,140,26,0.55); }
  .svRow.B .svKey { background: #4aa8ff; }
  .svRow.B .svFill { background: linear-gradient(90deg, #4aa8ff, #7ec4ff); box-shadow: 0 0 16px rgba(74,168,255,0.55); }
  .svRow.C .svKey { background: #53fc18; }
  .svRow.C .svFill { background: linear-gradient(90deg, #3ad10f, #7dff4d); box-shadow: 0 0 16px rgba(83,252,24,0.5); }
  .svRow.D .svKey { background: #c77dff; }
  .svRow.D .svFill { background: linear-gradient(90deg, #a855f7, #d8b4fe); box-shadow: 0 0 16px rgba(168,85,247,0.55); }
  /* 集計中: 票数を隠しバーを流す */
  #surveyBox.live .svVal { visibility: hidden; }
  #surveyBox.live .svFill { width: 0 !important; }
  #surveyBox.live .svBar {
    background: repeating-linear-gradient(-45deg, rgba(255,255,255,0.05) 0 8px, rgba(255,255,255,0.11) 8px 16px);
    background-size: 32px 100%;
    animation: svFlow 1.1s linear infinite;
  }
  @keyframes svFlow {
    from { background-position: 0 0; }
    to   { background-position: -32px 0; }
  }
  /* 結果: 最多を光らせる */
  .svRow.win .svFill { animation: svWin 1.6s ease-in-out infinite; }
  .svRow.win .svKey { box-shadow: 0 0 14px currentColor; }
  .svRow.win .svVal b { font-size: 27px; }
  @keyframes svWin {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.5) saturate(1.3); }
  }
  #svTotal {
    text-align: right;
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    font-weight: 700;
    letter-spacing: 1px;
    margin-top: 12px;
    min-height: 14px;
  }
  /* ===== トークのお題 ===== */
  #topicBar {
    position: fixed;
    bottom: 0;
    left: 12px;
    right: 414px;
    transform: translateY(110%);
    background: linear-gradient(135deg, rgba(14,14,16,0.94) 0%, rgba(8,8,10,0.94) 100%);
    backdrop-filter: blur(14px) saturate(160%);
    border-radius: 14px 14px 0 0;
    padding: 16px 30px 20px;
    box-shadow: 0 -8px 40px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
    z-index: 15;
    font-family: "Noto Sans JP", "Yu Gothic UI", sans-serif;
    display: flex;
    align-items: center;
    gap: 22px;
    transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 0;
  }
  #topicBar.on {
    transform: translateY(0);
    opacity: 1;
  }
  /* コメント欄が左にある時はお題を右側へ */
  #topicBar.pos-left { left: 414px; right: 12px; }
  #topicBar.pos-right { left: 12px; right: 414px; }
  #topicBar::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 3px;
    background: linear-gradient(90deg, #ff8c1a, #ffb347, #ff8c1a);
    background-size: 200% 100%;
    animation: topicFlow 3s linear infinite;
  }
  @keyframes topicFlow {
    from { background-position: 0 0; }
    to   { background-position: 200% 0; }
  }
  #topicLabel {
    flex-shrink: 0;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #ff8c1a;
    text-shadow: 0 0 16px rgba(255,140,26,0.55);
    padding-right: 22px;
    border-right: 1px solid rgba(255,255,255,0.14);
    line-height: 1.5;
  }
  #topicText {
    font-size: 34px;
    font-weight: 800;
    color: #fff;
    line-height: 1.3;
    text-shadow: 0 2px 14px rgba(0,0,0,0.6);
    word-break: break-word;
  }
  /* ===== 目標フォロワー ===== */
  #goalBox {
    position: fixed;
    box-sizing: border-box;
    top: 62px;
    width: 390px;
    display: none;
    background: rgba(8,8,10,0.72);
    backdrop-filter: blur(14px) saturate(160%);
    border-radius: 0 0 10px 10px;
    padding: 10px 16px 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
    z-index: 9;
    font-family: "Noto Sans JP", "Yu Gothic UI", sans-serif;
  }
  #goalBox.on { display: block; }
  #goalBox.pos-right { right: 12px; }
  #goalBox.pos-left { left: 12px; }
  #goalTop {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 7px;
  }
  #goalLabel {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 1px;
    color: #fff;
    white-space: nowrap;
  }
  #goalPrize {
    font-size: 22px;
    font-weight: 900;
    color: #ffd54f;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 18px rgba(255,213,79,0.55);
  }
  #goalPrize small { font-size: 13px; font-weight: 800; margin-left: 1px; }
  #goalBar {
    height: 8px;
    background: rgba(255,255,255,0.09);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  #goalFill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #ff8c1a, #ffd54f);
    box-shadow: 0 0 14px rgba(255,180,26,0.6);
    transition: width 0.8s cubic-bezier(0.3, 1, 0.4, 1);
  }
  #goalBox.done #goalFill { animation: goalGlow 1.6s ease-in-out infinite; }
  @keyframes goalGlow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.55) saturate(1.3); }
  }
  #goalFoot {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    font-size: 16px;
    font-weight: 800;
    color: rgba(255,255,255,0.7);
    font-variant-numeric: tabular-nums;
  }
  #goalFoot b { color: #fff; font-size: 21px; }
  #goalTgt {
    color: #ffd54f;
    font-size: 21px;
    font-weight: 900;
    text-shadow: 0 0 14px rgba(255,213,79,0.5);
  }
  #goalRemain {
    color: #ff8c1a;
    font-size: 18px;
    font-weight: 900;
    text-shadow: 0 0 14px rgba(255,140,26,0.5);
  }
  #goalBox.done #goalRemain { color: #ffd54f; }
  /* ===== クイズ(ミリオネア風) ===== */
  #quizBox {
    position: fixed;
    bottom: 130px;
    transform: scale(0.94);
    transform-origin: center bottom;
    max-width: 900px;
    display: none;
    opacity: 0;
    z-index: 25;
    font-family: "Noto Sans JP", "Yu Gothic UI", sans-serif;
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.2, 1, 0.3, 1);
  }
  #quizBox.on { display: block; opacity: 1; transform: scale(1); }
  /* コメント欄(390px+余白)を避けた領域の中央に配置 */
  #quizBox.pos-right { left: 12px; right: 414px; margin: 0 auto; }
  #quizBox.pos-left { left: 414px; right: 12px; margin: 0 auto; }

  /* 問題文パネル */
  #quizQ {
    position: relative;
    margin: 106px auto 14px;
    width: 92%;
    padding: 20px 46px;
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    color: #fff;
    line-height: 1.45;
    background: linear-gradient(180deg, #123a7a 0%, #071c42 100%);
    border: 2px solid #7fb2ff;
    border-radius: 8px;
    clip-path: polygon(28px 0, calc(100% - 28px) 0, 100% 50%, calc(100% - 28px) 100%, 28px 100%, 0 50%);
    box-shadow: 0 0 34px rgba(60,140,255,0.55), inset 0 0 30px rgba(0,60,160,0.7);
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  }

  /* 選択肢 2x2 */
  #quizOpts {
    position: relative;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 26px;
  }
  .qOpt {
    position: relative;
    padding: 13px 26px;
    background: linear-gradient(180deg, #10306b 0%, #061838 100%);
    border: 2px solid #5f9bf0;
    border-radius: 6px;
    clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 20px 100%, 0 50%);
    box-shadow: 0 0 18px rgba(50,120,230,0.4), inset 0 0 20px rgba(0,50,140,0.6);
    display: flex;
    align-items: center;
    gap: 12px;
    overflow: hidden;
  }
  .qKey {
    color: #ffb300;
    font-size: 23px;
    font-weight: 900;
    flex-shrink: 0;
    text-shadow: 0 0 12px rgba(255,179,0,0.6);
  }
  .qLabel {
    color: #fff;
    font-size: 24px;
    font-weight: 800;
    line-height: 1.3;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    flex: 1;
  }
  .qCount {
    flex-shrink: 0;
    font-size: 15px;
    font-weight: 800;
    color: rgba(255,255,255,0.55);
    font-variant-numeric: tabular-nums;
  }
  /* 集計中は票数を隠す */
  #quizBox:not(.counted) .qCount { visibility: hidden; }

  /* 正解演出 */
  .qOpt.correct {
    background: linear-gradient(180deg, #1f8f2a 0%, #0b4a12 100%);
    border-color: #7dff8c;
    box-shadow: 0 0 34px rgba(80,240,110,0.75), inset 0 0 24px rgba(0,120,30,0.7);
    animation: qWin 1.1s ease-in-out infinite;
  }
  .qOpt.correct .qKey { color: #d4ffda; text-shadow: 0 0 14px rgba(140,255,160,0.9); }
  .qOpt.correct .qCount { color: rgba(255,255,255,0.8); }
  @keyframes qWin {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.35); }
  }
  #quizBox.revealed .qOpt:not(.correct) { opacity: 0.42; }

  /* オーディエンス カウントダウン(中央の丸) */
  #quizCount {
    position: absolute;
    left: 50%;
    top: -104px;
    transform: translateX(-50%);
    width: 92px;
    height: 92px;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: radial-gradient(circle at 50% 40%, rgba(20,60,140,0.96), rgba(4,14,40,0.98));
    border: 3px solid #7fb2ff;
    box-shadow: 0 0 44px rgba(70,150,255,0.85), inset 0 0 30px rgba(0,60,160,0.8);
    z-index: 3;
  }
  #quizCount.on { display: flex; }
  #quizCountNum {
    font-size: 40px;
    font-weight: 900;
    color: #fff;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 26px rgba(140,200,255,0.9);
  }
  #quizCountLabel {
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #7fb2ff;
    margin-top: 6px;
  }
  #quizCount.urgent {
    border-color: #ff6b6b;
    box-shadow: 0 0 50px rgba(255,80,80,0.9), inset 0 0 30px rgba(120,0,0,0.7);
    animation: qCountPulse 0.8s ease-in-out infinite;
  }
  #quizCount.urgent #quizCountNum { color: #ff8080; text-shadow: 0 0 26px rgba(255,90,90,0.95); }
  #quizCount.urgent #quizCountLabel { color: #ff8080; }
  @keyframes qCountPulse {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.1); }
  }
  /* 最多得票(オーディエンスの答え) */
  .qOpt.top {
    background: linear-gradient(180deg, #2f66c8 0%, #0b2a6e 100%);
    border-color: #ffd54f;
    box-shadow: 0 0 30px rgba(255,213,79,0.7), inset 0 0 24px rgba(0,60,180,0.6);
    animation: qTop 1.4s ease-in-out infinite;
  }
  .qOpt.top .qCount { color: #ffd54f; }
  @keyframes qTop {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }
  #quizFoot {
    text-align: center;
    margin: 14px auto 0;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.5px;
    color: #fff;
    background: rgba(6,18,44,0.92);
    border: 1px solid rgba(127,178,255,0.45);
    border-radius: 999px;
    padding: 7px 26px;
    display: inline-block;
    text-shadow: 0 0 16px rgba(120,180,255,0.5);
  }
  #quizFoot:empty { display: none; }
  #quizFootWrap { text-align: center; }
</style>
</head>
<body>
  <div id="statsBar" class="pos-right">
  <div id="fwBar" class="bar-row">
    <div class="plat-label fw-label">ふわっち</div>
    <div class="stat" id="statFwF"><span class="dot"></span><span class="txt"><span class="label">FOLLOWERS</span><span class="num"></span></span></div>
    <div class="stat" id="statFwV"><span class="dot"></span><span class="txt"><span class="label">VIEWERS</span><span class="num"></span></span></div>
  </div>
  <div id="kickBar" class="bar-row">
    <div class="plat-label kick-label">KICK</div>
    <div class="stat kick" id="statKickF"><span class="dot"></span><span class="txt"><span class="label">FOLLOWERS</span><span class="num"></span></span></div>
    <div class="stat kick" id="statKickV"><span class="dot"></span><span class="txt"><span class="label">VIEWERS</span><span class="num"></span></span></div>
  </div>
</div>
  <div class="stat" id="statFwF"><span class="dot"></span><span class="txt"><span class="label">FOLLOWERS</span><span class="num"></span></span></div>
  <div class="stat" id="statFwV"><span class="dot"></span><span class="txt"><span class="label">VIEWERS</span><span class="num"></span></span></div>
  <div class="stat kick" id="statKickF"><span class="dot"></span><span class="txt"><span class="label">FOLLOWERS</span><span class="num"></span></span></div>
  <div class="stat kick" id="statKickV"><span class="dot"></span><span class="txt"><span class="label">VIEWERS</span><span class="num"></span></span></div>
</div>
<div id="list" class="pos-right"></div>
<div id="surveyBox">
  <div id="svHead">
    <span id="svTitle">アンケート</span>
    <span id="svTimer"></span>
  </div>
  <div id="svProg"><div id="svProgBar"></div></div>
  <div id="svRows"></div>
  <div id="svTotal"></div>
</div>
<div id="topicBar" class="pos-right">
  <div id="topicLabel">TALK<br>THEME</div>
  <div id="topicText"></div>
</div>
<div id="goalBox" class="pos-right">
  <div id="goalTop">
    <span id="goalLabel">目標達成でプレゼント</span>
    <span id="goalPrize"></span>
  </div>
  <div id="goalBar"><div id="goalFill"></div></div>
  <div id="goalFoot">
    <span><b id="goalCur">0</b> / <span id="goalTgt">0</span></span>
    <span id="goalRemain"></span>
  </div>
</div>
<div id="quizBox" class="pos-right">
  <div id="quizQwrap" style="position:relative"><div id="quizQ"></div><div id="quizCount"><div id="quizCountNum"></div><div id="quizCountLabel">AUDIENCE</div></div></div>
  <div id="quizOpts"></div>
  <div id="quizFootWrap"><div id="quizFoot"></div></div>
</div>
<script>
  // ?platform=tiktok を付けると、メインのふわっち/Kickとは独立してTikTokのコメントだけを表示できる
  // (TikTokキャプチャ用ウィンドウなど)。?window=1 で背景を黒にする(ウィンドウキャプチャ用)。
  const urlParams = new URLSearchParams(location.search);
  const platformOverride = urlParams.get('platform');
  if (urlParams.get('window') === '1') {
    document.documentElement.style.background = '#000';
    document.addEventListener('DOMContentLoaded', () => { document.body.style.background = '#000'; });
  }
  const API_URL = "/api/overlay/comments" + (platformOverride ? `?platform=${encodeURIComponent(platformOverride)}` : '');
  const API_URL_SEP = platformOverride ? '&' : '?';
  const STATUS_URL = "/api/overlay/status";
  const POLL_MS = 1000;
  const STATUS_POLL_MS = 5000;
  const MAX_ITEMS = 12;       // 画面に保持する最大コメント数
  const LIFETIME_MS = 45000;  // 表示時間(その後フェードアウト)

  const list = document.getElementById('list');
  let lastId = null;
  let lastPlatform = null;

  // 名前の色(視認性の高い明るめカラーを名前から決定)
  function colorFromName(name) {
    let hash = 0;
    for (let i = 0; i < (name || '').length; i++) {
      hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    }
    const hues = [0, 30, 50, 90, 130, 180, 200, 260, 280, 320];
    return `hsl(${hues[hash % hues.length]}, 85%, 70%)`;
  }

  // Kickエモート [emote:ID:名前] を画像に変換してcontainerへ追加
  function renderTextWithEmotes(container, text) {
    const re = /\[emote:(\d+):[^\]]*\]/g;
    let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) container.appendChild(document.createTextNode(text.slice(last, m.index)));
      const img = document.createElement('img');
      img.src = `https://files.kick.com/emotes/${m[1]}/fullsize`;
      img.style.height = '1.3em';
      img.style.verticalAlign = 'middle';
      img.onerror = () => { img.remove(); };
      container.appendChild(img);
      last = re.lastIndex;
    }
    if (last < text.length) container.appendChild(document.createTextNode(text.slice(last)));
  }

  function addEntry(c) {
    const el = document.createElement('div');
    el.className = 'c' + (c.isItem ? ' item' : '');

    const name = document.createElement('span');
    name.className = 'name';
    name.style.color = c.isItem ? '#ffd54f' : colorFromName(c.name);
    name.textContent = (c.isFollower ? '★ ' : '') + c.name;
    el.appendChild(name);

    const text = document.createElement('div');
    text.className = 'text';

    if (c.isItem && c.itemData && c.itemData.image_url) {
      const count = Math.min(Math.max(c.itemCount || 1, 1), 10);
      for (let i = 0; i < count; i++) {
        const img = document.createElement('img');
        img.src = c.itemData.image_url;
        img.onerror = () => { img.remove(); };
        text.appendChild(img);
      }
      if (c.text) text.appendChild(document.createTextNode(' ' + c.text));
      if (c.itemScore) text.appendChild(document.createTextNode(` (${c.itemScore}点)`));
    } else {
      if (c.isItem) text.appendChild(document.createTextNode('🎁 '));
      renderTextWithEmotes(text, c.text);
    }

    el.appendChild(text);
    list.appendChild(el);

    // 上限を超えたら古いものから削除(時間経過では消えない)
    while (list.children.length > MAX_ITEMS) {
      list.removeChild(list.firstChild);
    }
  }

  const statLast = {};
  function setStat(id, count) {
    const el = document.getElementById(id);
    if (count === null || count === undefined) { el.style.display = 'none'; return; }
    if (el.style.display !== 'flex') {
      el.style.display = 'flex';
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 600);
    }
    if (statLast[id] !== count) {
      el.querySelector('.num').textContent = Number(count).toLocaleString();
      if (statLast[id] !== undefined) {
        el.classList.remove('bump');
        void el.offsetWidth;
        el.classList.add('bump');
        setTimeout(() => el.classList.remove('bump'), 750);
      }
      statLast[id] = count;
    }
  }
  function refreshRows(data) {
    const fwBar = document.getElementById('fwBar');
    const kickBar = document.getElementById('kickBar');
    const statsBar = document.getElementById('statsBar');
    const fwShow = data.showFw === true;
    const kickShow = data.showKick === true;
    fwBar.classList.toggle('on', fwShow);
    kickBar.classList.toggle('on', kickShow);
    kickBar.style.borderTop = kickShow ? '1px solid rgba(255,255,255,0.08)' : '';
    statsBar.style.display = (fwShow || kickShow) ? 'flex' : 'none';
  }

  function updateStats(data) {
    setStat('statFwF', data.followerCount);
    setStat('statFwV', data.fwViewerCount);
    setStat('statKickF', data.kickFollowerCount);
    setStat('statKickV', data.kickViewerCount);
    refreshRows(data);
    updateSurvey(data.survey);
    updateTopic(data.topic);
    updateGoal(data.goal);
    updateQuiz(data.quiz);
  }

  // ===== クイズ =====
  let qzLocal = null, qzSyncAt = 0, qzTicker = null;

  function updateQuiz(q) {
    const box = document.getElementById('quizBox');
    if (!box) return;
    if (!q) {
      box.classList.remove('on');
      qzLocal = null;
      if (qzTicker) { clearInterval(qzTicker); qzTicker = null; }
      return;
    }
    qzLocal = q;
    qzSyncAt = Date.now();
    box.classList.add('on');
    box.classList.toggle('revealed', !!q.revealed);
    box.classList.toggle('counted', !!q.showCounts);
    document.getElementById('quizQ').textContent = q.question;

    const wrap = document.getElementById('quizOpts');
    const sig = q.results.map(r => r.key + ':' + r.label).join('|');
    if (wrap.dataset.sig !== sig) {
      wrap.dataset.sig = sig;
      wrap.innerHTML = '';
      q.results.forEach(r => {
        const el = document.createElement('div');
        el.className = 'qOpt';
        const k = document.createElement('span');
        k.className = 'qKey';
        k.textContent = r.key + ':';
        const l = document.createElement('span');
        l.className = 'qLabel';
        l.textContent = r.label;
        const c = document.createElement('span');
        c.className = 'qCount';
        c.textContent = '0票';
        el.appendChild(k); el.appendChild(l); el.appendChild(c);
        wrap.appendChild(el);
      });
    }

    const max = Math.max(...q.results.map(r => r.count));
    const opts = wrap.querySelectorAll('.qOpt');
    q.results.forEach((r, i) => {
      const el = opts[i];
      if (!el) return;
      el.querySelector('.qCount').textContent = r.count + '票 (' + r.pct + '%)';
      // 開票後は最多得票を金色に、正解発表後は正解を緑に
      el.classList.toggle('top', q.showCounts && !q.revealed && max > 0 && r.count === max);
      el.classList.toggle('correct', !!q.revealed && q.correct === r.key);
    });

    if (!qzTicker) qzTicker = setInterval(qzTick, 100);
    qzTick();
  }

  function qzTick() {
    const q = qzLocal;
    if (!q) return;
    const circle = document.getElementById('quizCount');
    const foot = document.getElementById('quizFoot');

    if (q.audience === 'voting') {
      const elapsed = (Date.now() - qzSyncAt) / 1000;
      const remain = Math.max(0, q.audienceRemain - elapsed);
      circle.classList.add('on');
      circle.classList.toggle('urgent', remain <= 10);
      document.getElementById('quizCountNum').textContent = Math.ceil(remain);
      foot.textContent = 'コメントで A / B / C / D を入力して回答してください';
    } else {
      circle.classList.remove('on', 'urgent');
      if (q.revealed) {
        foot.textContent = (q.correct ? '正解は ' + q.correct + ' ！' : '') + '　総回答数 ' + q.total;
      } else if (q.audience === 'done') {
        const max = Math.max(...q.results.map(r => r.count));
        const top = q.results.filter(r => r.count === max && max > 0).map(r => r.key).join('・');
        foot.textContent = top ? 'オーディエンスの答えは ' + top + '　（総回答数 ' + q.total + '）' : '回答がありませんでした';
      } else {
        foot.textContent = '';
      }
    }
  }

  // ===== 目標フォロワー =====
  let goalLocalBase = null, goalLocalKey = null;
  function updateGoal(goal) {
    const box = document.getElementById('goalBox');
    if (!box) return;
    if (!goal || !goal.target || goal.current === null || goal.current === undefined) {
      box.classList.remove('on');
      return;
    }
    box.classList.add('on');
    const cur = goal.current;
    const tgt = goal.target;
    const done = cur >= tgt;
    box.classList.toggle('done', done);
    const prize = Math.round(cur * goal.rate);
    document.getElementById('goalPrize').innerHTML =
      '¥' + prize.toLocaleString() + '<small>を1名様に</small>';
    document.getElementById('goalCur').textContent = cur.toLocaleString();
    document.getElementById('goalTgt').textContent = tgt.toLocaleString();
    // 基準値: サーバー指定 → 無ければ初回表示時の値を記憶して使う
    let base = (typeof goal.baseline === 'number' && goal.baseline > 0 && goal.baseline < tgt)
      ? goal.baseline : null;
    if (base === null) {
      if (goalLocalBase === null || goalLocalKey !== tgt) {
        goalLocalBase = cur;
        goalLocalKey = tgt;
      }
      base = goalLocalBase;
    }
    if (base >= tgt) base = tgt - 1;
    const span = Math.max(1, tgt - base);
    const raw = Math.max(0, Math.min(1, (cur - base) / span));
    // 序盤ほど伸びが緩やかになる曲線(満杯に見えにくくする)
    const prog = Math.pow(raw, 1.8) * 100;
    document.getElementById('goalFill').style.width = prog + '%';
    document.getElementById('goalRemain').textContent =
      done ? '目標達成！' : 'あと ' + (tgt - cur).toLocaleString() + '人';
  }

  // ===== トークのお題 =====
  let lastTopic = null;
  function updateTopic(topic) {
    const bar = document.getElementById('topicBar');
    const txt = document.getElementById('topicText');
    if (!bar) return;
    const t = topic || '';
    if (t === lastTopic) return;
    if (!t) {
      bar.classList.remove('on');
      lastTopic = '';
      return;
    }
    if (lastTopic) {
      // お題が入れ替わる時は一度引っ込めてから出す
      bar.classList.remove('on');
      setTimeout(() => {
        txt.textContent = t;
        bar.classList.add('on');
      }, 700);
    } else {
      txt.textContent = t;
      bar.classList.add('on');
    }
    lastTopic = t;
  }

  // ===== アンケート =====
  let svData = null, svSyncAt = 0, svTicker = null, svVisible = false;

  function updateSurvey(sv) {
    const box = document.getElementById('surveyBox');
    if (!box) return;
    if (!sv) {
      box.style.display = 'none';
      svVisible = false;
      svData = null;
      if (svTicker) { clearInterval(svTicker); svTicker = null; }
      return;
    }
    svData = sv;
    svSyncAt = Date.now();
    if (!svVisible) {
      box.style.display = 'block';
      svVisible = true;
    }
    if (!svTicker) svTicker = setInterval(svTick, 100);
    svTick();
  }

  function svTick() {
    const sv = svData;
    if (!sv) return;
    const box = document.getElementById('surveyBox');
    const timer = document.getElementById('svTimer');
    const title = document.getElementById('svTitle');
    const prog = document.getElementById('svProgBar');
    const total = document.getElementById('svTotal');

    // 行を構築(選択肢が変わった時のみ作り直す)
    const wrap = document.getElementById('svRows');
    const sig = sv.results.map(r => r.key + ':' + r.label).join('|');
    if (wrap.dataset.sig !== sig) {
      wrap.dataset.sig = sig;
      wrap.innerHTML = '';
      sv.results.forEach(r => {
        const row = document.createElement('div');
        row.className = 'svRow ' + r.key;
        const top = document.createElement('div');
        top.className = 'svTop';
        const lab = document.createElement('span');
        lab.className = 'svLabel';
        const key = document.createElement('span');
        key.className = 'svKey';
        key.textContent = r.key;
        lab.appendChild(key);
        lab.appendChild(document.createTextNode(r.label));
        const val = document.createElement('span');
        val.className = 'svVal';
        val.innerHTML = '<b>0</b>票 / <span>0</span>%';
        top.appendChild(lab);
        top.appendChild(val);
        const bar = document.createElement('div');
        bar.className = 'svBar';
        const fill = document.createElement('div');
        fill.className = 'svFill';
        bar.appendChild(fill);
        row.appendChild(top);
        row.appendChild(bar);
        wrap.appendChild(row);
      });
    }

    // 数値反映
    const max = Math.max(...sv.results.map(r => r.count));
    sv.results.forEach((r, i) => {
      const row = wrap.children[i];
      if (!row) return;
      row.querySelector('.svVal b').textContent = r.count;
      row.querySelector('.svVal span').textContent = r.pct;
      row.querySelector('.svFill').style.width = r.pct + '%';
      row.classList.toggle('win', !sv.active && max > 0 && r.count === max);
    });

    if (sv.active) {
      const elapsed = (Date.now() - svSyncAt) / 1000;
      const remain = Math.max(0, sv.remainSec - elapsed);
      box.classList.add('live');
      timer.textContent = Math.ceil(remain);
      timer.classList.remove('ended');
      timer.classList.toggle('urgent', remain <= 10);
      title.textContent = 'コメントで投票してください';
      prog.style.width = Math.max(0, (remain / (sv.durationSec || 60)) * 100) + '%';
      total.textContent = '';
    } else {
      box.classList.remove('live');
      timer.textContent = '結果';
      timer.classList.add('ended');
      timer.classList.remove('urgent');
      title.textContent = 'アンケート結果';
      prog.style.width = '0%';
      total.textContent = '総投票数 ' + sv.total;
    }
  }

  async function pollStatus() {
    try {
      const res = await fetch(STATUS_URL);
      const data = await res.json();
      const posCls = data.verticalPos === 'left' ? 'pos-left' : 'pos-right';
      list.className = posCls;
      document.getElementById('statsBar').classList.remove('pos-left', 'pos-right');
      document.getElementById('statsBar').classList.add(posCls);
      const tb = document.getElementById('topicBar');
      tb.classList.remove('pos-left', 'pos-right');
      tb.classList.add(posCls);
      const gb = document.getElementById('goalBox');
      gb.classList.remove('pos-left', 'pos-right');
      gb.classList.add(posCls);
      const qb = document.getElementById('quizBox');
      qb.classList.remove('pos-left', 'pos-right');
      qb.classList.add(posCls);
      updateStats(data);
      if (data.bgOpacity !== undefined) {
        document.documentElement.style.setProperty('--bg-op', (data.bgOpacity / 100).toFixed(2));
      }
      // プラットフォームが切り替わったら表示をクリア
      const pf = data.kickSlug ? 'kick' : (data.liveId ? 'fw' : '');
      if (lastPlatform !== null && pf !== lastPlatform) {
        list.innerHTML = '';
        lastId = null;
      }
      lastPlatform = pf;
    } catch (e) {}
    setTimeout(pollStatus, STATUS_POLL_MS);
  }

  async function poll() {
    try {
      const url = lastId === null
        ? `${API_URL}${API_URL_SEP}afterId=0`
        : `${API_URL}${API_URL_SEP}afterId=${lastId}`;
      const res = await fetch(url);
      const data = await res.json();
      if (lastId === null) {
        // 初回は直近の数件だけ表示
        const recent = data.comments.slice(-8);
        for (const c of recent) addEntry(c);
      } else {
        for (const c of data.comments) addEntry(c);
      }
      lastId = data.lastId;
    } catch (e) {}
    setTimeout(poll, POLL_MS);
  }

  pollStatus();
  poll();
</script>
</body>
</html>
