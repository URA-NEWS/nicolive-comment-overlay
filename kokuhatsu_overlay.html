<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>告発ゲーム 配信用</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:transparent;color:#f1eadc;font-family:"Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif}.stage{width:1920px;height:1080px;padding:46px 58px;background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),radial-gradient(circle at 50% 0,rgba(216,182,90,.16),transparent 34%),linear-gradient(135deg,#050505,#111114 48%,#050505);background-size:46px 46px,46px 46px,auto,auto;transform-origin:top left;position:relative}.stage:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035),rgba(255,255,255,.035) 1px,transparent 1px,transparent 5px);opacity:.35;pointer-events:none}.content{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:28px}.top{display:grid;grid-template-columns:1fr 440px;gap:34px}.code{color:#d8b65a;font-family:"Bahnschrift Condensed","Arial Narrow","Yu Gothic UI",sans-serif;font-size:28px;font-weight:600;letter-spacing:.16em}h1{margin:8px 0 0;font-size:112px;line-height:1;font-weight:600;letter-spacing:.08em;text-shadow:0 0 22px rgba(216,182,90,.28)}.sub{margin-top:16px;color:#9e9689;font-size:30px}.prize{padding:24px 28px;background:rgba(216,182,90,.1);border:1px solid rgba(216,182,90,.35)}.label{color:#9e9689;font-family:"Bahnschrift Condensed","Arial Narrow","Yu Gothic UI",sans-serif;font-size:24px;letter-spacing:.14em}.money{margin-top:4px;color:#d8b65a;font-family:"Bahnschrift Condensed","Arial Narrow","Yu Mincho",serif;font-size:82px;line-height:1;font-weight:600;letter-spacing:.04em}.body{display:grid;grid-template-columns:1.1fr .9fr;gap:30px}.stage.mode-question .body,.stage.mode-amida .body{grid-template-columns:1fr}.stage.mode-question .body>.panel:first-child{display:none}.stage.mode-amida .body>.panel:last-child{display:none}.panel{padding:26px;background:rgba(13,13,16,.88);border:1px solid rgba(255,255,255,.1)}.panel-title{display:flex;justify-content:space-between;margin-bottom:20px;color:#9e9689;font-size:23px}.days{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}.day{height:86px;padding:12px 8px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.12);text-align:center}.day.done{border-color:rgba(74,183,122,.75)}.day.miss{border-color:rgba(185,31,44,.9)}.day small{display:block;color:#9e9689;font-size:18px}.day strong{display:block;margin-top:4px;font-size:38px;line-height:1}svg{width:100%;height:530px;display:block;background:#050506;border:1px solid rgba(255,255,255,.08)}.v,.h{stroke:rgba(241,234,220,.28);stroke-width:4}.trace{stroke:#d8b65a;stroke-width:10;fill:none;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px rgba(216,182,90,.7))}.svgtext{fill:#f1eadc;font-size:31px;font-weight:700;text-anchor:middle}.goal{fill:#d8b65a;font-size:23px;text-anchor:middle}.node{fill:#050506;stroke:#d8b65a;stroke-width:4}.step{fill:#050506;stroke:rgba(216,182,90,.72);stroke-width:3}.stepText{fill:#d8b65a;font-size:20px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.question{min-height:146px;padding:24px;background:#070708;border-left:6px solid #d8b65a;font-size:33px;line-height:1.36;font-weight:600;letter-spacing:.05em}.choices{display:grid;gap:14px;margin-top:18px}.choice{display:grid;grid-template-columns:70px 1fr 112px;align-items:center;gap:18px;min-height:78px;padding:12px 18px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.11)}.key{color:#d8b65a;font-family:"Bahnschrift Condensed","Arial Narrow",sans-serif;font-size:48px;font-weight:600}.ctext{font-size:28px;line-height:1.25;font-weight:600}.badge{color:#9e9689;font-size:20px;text-align:right}.choice.majority{border-color:rgba(216,182,90,.72);background:rgba(216,182,90,.1)}.choice.correct .badge{color:#4ab77a}.choice.wrong .badge{color:#b91f2c}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.stat{padding:18px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1)}.stat div:first-child{color:#9e9689;font-size:19px}.stat div:last-child{margin-top:4px;font-size:34px;font-weight:700}.bars{margin-top:18px;display:grid;gap:10px}.bar{display:grid;grid-template-columns:42px 1fr 74px;align-items:center;gap:10px;color:#9e9689}.track{height:12px;background:rgba(255,255,255,.08);overflow:hidden}.fill{height:100%;background:#d8b65a;width:0}.keyword{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:18px}.letter{height:72px;display:grid;place-items:center;background:#050506;border:1px solid rgba(216,182,90,.28);color:#d8b65a;font-size:38px;font-weight:700}.footer{display:flex;justify-content:space-between;gap:24px;color:#9e9689;font-size:24px}.alert{color:#d8b65a}
</style>
</head>
<body><main class="stage" id="stage"><div class="content"><section class="top"><div><div class="code">KOKUHATSU GAME / <span id="dayCode">DAY 7</span></div><h1>告発ゲーム</h1><div class="sub">6日間の選択が、賞金の額を決める。</div></div><aside class="prize"><div class="label">CURRENT PRIZE</div><div class="money" id="money">100万円</div></aside></section><section class="body"><div class="panel"><div class="panel-title"><span>AMIDA ROUTE</span><span id="routeName">未確定</span></div><div class="days" id="days"></div><svg viewBox="0 0 860 530" id="amida"><g id="grid"></g><path class="trace" id="trace" d="M300 75 L300 448"/><g id="steps"></g><text class="svgtext" x="120" y="48">LEFT</text><text class="svgtext" x="300" y="48">START</text><text class="svgtext" x="500" y="48">RIGHT</text><text class="goal" x="120" y="492">減額</text><text class="goal" x="300" y="492">維持</text><text class="goal" x="500" y="492">告発</text></svg></div><div class="panel"><div class="panel-title"><span>TODAY'S QUESTION</span><span>多数派が公式回答</span></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="stats"><div class="stat"><div>ミス回数</div><div id="missText">0 / 6</div></div><div class="stat"><div>減額</div><div>1ミス -15万円</div></div></div><div class="bars" id="bars"></div><div class="keyword" id="keyword"></div></div></section><section class="footer"><div>Final Day：正解ルート + 隠しキーワードを回答</div><div class="alert" id="ticker"></div></section></div></main><script>
const days=['6','5','4','3','2','1'];const x=[120,300,500], yTop=75, yBottom=448, ySteps=[132,186,240,294,348,402];const stageEl=document.getElementById('stage'), daysEl=document.getElementById('days'), gridEl=document.getElementById('grid'), stepsEl=document.getElementById('steps');function scale(){const f=Math.min(innerWidth/1920,innerHeight/1080);stageEl.style.transform=`scale(${f})`;document.body.style.width=1920*f+'px';document.body.style.height=1080*f+'px'}function svgEl(name, attrs){const el=document.createElementNS('http://www.w3.org/2000/svg',name);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));return el}function drawGrid(){gridEl.innerHTML='';x.forEach(px=>gridEl.append(svgEl('line',{class:'v',x1:px,y1:yTop,x2:px,y2:yBottom})));ySteps.forEach((py,i)=>{const from=i%2===0?0:1;gridEl.append(svgEl('line',{class:'h',x1:x[from],y1:py,x2:x[from+1],y2:py}))})}function buildPath(route){let col=1, d=`M${x[col]} ${yTop}`;stepsEl.innerHTML='';route.slice(0,6).forEach((key,i)=>{const py=ySteps[i];const next=key==='A'?Math.max(0,col-1):key==='C'?Math.min(2,col+1):col;d+=` L${x[col]} ${py}`;if(next!==col)d+=` L${x[next]} ${py}`;const cx=next===col?x[col]:(x[col]+x[next])/2;stepsEl.append(svgEl('circle',{class:'step',cx,cy:py,r:18}));const t=svgEl('text',{class:'stepText',x:cx,y:py});t.textContent=key;stepsEl.append(t);col=next});d+=` L${x[col]} ${yBottom}`;stepsEl.append(svgEl('circle',{class:'node',cx:x[col],cy:yBottom,r:12}));return d}function render(s){stageEl.classList.remove('mode-question','mode-amida','mode-all');stageEl.classList.add(`mode-${s.viewMode||'question'}`);dayCode.textContent=s.day==='0'?'FINAL DAY':`DAY ${s.day}`;money.textContent=`${s.prize}万円`;missText.textContent=`${s.misses} / 6`;routeName.textContent=(s.route||[]).join('-')||'未確定';question.textContent=s.question;ticker.textContent=s.ticker||'';daysEl.innerHTML='';days.forEach((d,i)=>{const b=document.createElement('div');b.className='day'+(s.route&&s.route[i]?' done':'')+(i<Number(s.misses)?' miss':'');b.innerHTML=`<small>Day ${d}</small><strong>${s.route?.[i]||'?'}</strong>`;daysEl.append(b)});choices.innerHTML='';['A','B','C'].forEach(k=>{const row=document.createElement('div');row.className='choice';if(s.majority===k)row.classList.add('majority');if(s.revealResult&&s.correct===k)row.classList.add('correct');if(s.revealResult&&s.majority===k&&s.correct&&s.correct!==k)row.classList.add('wrong');row.innerHTML=`<div class="key">${k}</div><div class="ctext">${s.choices?.[k]||k}</div><div class="badge">${s.majority===k?'多数派':s.revealResult&&s.correct===k?'正解':''}</div>`;choices.append(row)});bars.innerHTML='';(s.survey?.results||[]).forEach(r=>{const el=document.createElement('div');el.className='bar';const hide=s.survey.active&&s.survey.remainSec<=30;el.innerHTML=`<b>${r.key}</b><div class="track"><div class="fill" style="width:${hide?0:r.pct}%"></div></div><span>${hide?'集計中':r.count+'票'}</span>`;bars.append(el)});keyword.innerHTML='';Array.from(String(s.keyword||'').padEnd(6,'？')).slice(0,6).forEach(ch=>{const c=document.createElement('div');c.className='letter';c.textContent=ch;keyword.append(c)});trace.setAttribute('d',buildPath(s.route||[]))}async function poll(){try{const r=await fetch('/api/kokuhatsu/state');render(await r.json())}catch{}setTimeout(poll,1000)}addEventListener('resize',scale);scale();poll();drawGrid();
</script></body></html>
